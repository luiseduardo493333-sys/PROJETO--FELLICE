<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fellice Estoque</title>
  <link rel="icon" type="image/png" href="/static/img/logo_fellice.png">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

  <div class="auth-wrapper">
    <!-- LOGO E IDENTIDADE -->
    <div class="auth-brand">
      <img src="/static/img/logo_fellice.png" alt="Pizzaria Fellice" class="auth-brand-logo">
      <div class="auth-brand-sub">ESTOQUE</div>
      <div class="auth-brand-desc">Sistema de Controle de Estoque Pizzaria Fellice</div>
    </div>

    <!-- CARD DE LOGIN -->
    <div class="auth-card">
      <h2 class="auth-card-title">Acesse sua conta</h2>

      {% if erro %}
      <div style="background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.4); color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 12px; margin-bottom: 16px; text-align: center;">
        {{ erro }}
      </div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="auth-group">
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input type="email" name="email" value="{{ email or '' }}" class="auth-input" placeholder="Digite seu e-mail" required autofocus>
          </div>
        </div>

        <div class="auth-group">
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" name="senha" id="senhaInput" class="auth-input" placeholder="Digite sua senha" required>
            <button type="button" class="auth-toggle-pwd" onclick="toggleSenha()" title="Mostrar/ocultar senha">
              <svg id="eyeIcon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit">Entrar</button>

        <a href="javascript:void(0)" onclick="alert('Por favor, solicite a redefinição de senha ao Administrador da rede.');" class="auth-forgot-link">
          Esqueceu sua senha?
        </a>
      </form>
    </div>

    <!-- RODAPÉ DE UNIDADES -->
    <div class="auth-footer-units">
      Unidades: Tatuapé &nbsp;|&nbsp; Iocuné &nbsp;|&nbsp; Aricanduva
    </div>
  </div>

  <script>
    function toggleSenha() {
      const input = document.getElementById('senhaInput');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24m-6.72-2.12a10.6 10.6 0 0 1 4.6-2 10.6 10.6 0 0 1 4.6 2m-9.2 0a15.4 15.4 0 0 1-3.6-2 15.4 15.4 0 0 1 17.6 0 15.4 15.4 0 0 1-3.6 2"/><line x1="2" y1="2" x2="22" y2="22"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }
  </script>
</body>
</html>
